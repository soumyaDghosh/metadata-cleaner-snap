name: metadata-cleaner 
base: core24
adopt-info: metadata-cleaner
license: GPL-3.0+
platforms:
  amd64:
  arm64:
  armhf:

website: https://github.com/soumyaDghosh/metadata-cleaner-snap
source-code: https://gitlab.com/rmnvgr/metadata-cleaner
issues: https://github.com/soumyaDghosh/metadata-cleaner-snap/issues
contact: soumyadeepghosh2004@zohomail.in

grade: stable 
confinement: strict 
compression: lzo

parts:    
  mat2:
    source: https://0xacab.org/jvoisin/mat2.git
    source-tag: '0.13.4'
# ext:updatesnap
#   version-format:
#     ignore: true
    plugin: python
    prime:
      - -usr/bin/activate*
      - -usr/bin/python*
      - -usr/bin/pip*
      - -usr/bin/wheel
      - -usr/lib/*/dist-packages/pip*
      - -usr/lib/*/dist-packages/pkg_resources
      - -usr/lib/*/dist-packages/setuptools*
      - -usr/lib/*/dist-packages/wheel*
      - -pyvenv.cfg
      - -lib
      - -lib64
      - -include
      - -share
      - -man
    organize:
      bin: usr/bin
      lib/python3.12/site-packages: usr/lib/python3/dist-packages
  metadata-cleaner:
    plugin: meson
    source: https://gitlab.com/rmnvgr/metadata-cleaner.git
    source-tag: 'v4.0.0'
    source-depth: 1
    override-pull: |
      craftctl default
      patch -p1 < $CRAFT_PROJECT_DIR/patches/metadata-cleaner.patch
    override-build: |
      craftctl default
      mkdir -p $CRAFT_PART_INSTALL/meta/gui
      cp -r $CRAFT_PART_INSTALL/snap/$CRAFT_PROJECT_NAME/current/usr/share/icons $CRAFT_PART_INSTALL/meta/gui/
      for i in `find $CRAFT_PART_INSTALL/meta/gui/icons -name "*.svg" -o -name "*.png"`; do
        mv $i "`dirname $i`/snap.$CRAFT_PROJECT_NAME.`basename $i`"
      done
    meson-parameters:
      - --prefix=/snap/metadata-cleaner/current/usr
    organize:
      snap/metadata-cleaner/current: .
    parse-info: [usr/share/metainfo/fr.romainvigier.MetadataCleaner.metainfo.xml]
  deps:
    plugin: nil
    stage-packages:
      - media-types
      - libpoppler134
      - libimage-exiftool-perl
    prime:
      - usr/share/mime.types
      - usr/lib/$CRAFT_ARCH_TRIPLET/libpoppler.so.*
      - usr/bin/exiftool
      - usr/bin/lib/*
    organize:
      etc/mime.types: usr/share/mime.types
      usr/share/perl5: usr/bin/lib  

plugs:
  ffmpeg-2404:
    interface: content
    target: ffmpeg-platform
    default-provider: ffmpeg-2404
  shmem:
    interface: shared-memory
    private: true

slots:
  metadata-cleaner:
    interface: dbus
    bus: session
    name: fr.romainvigier.MetadataCleaner
apps:
  metadata-cleaner:
    command: usr/bin/metadata-cleaner
    desktop: usr/share/applications/fr.romainvigier.MetadataCleaner.desktop
    extensions: [gnome]
    environment:
      PYTHONPATH: $SNAP/usr/lib/python3/dist-packages
    common-id: fr.romainvigier.MetadataCleaner
